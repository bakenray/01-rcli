[package]
name = "rcli"
version = "0.1.0"
edition = "2021"
authors = ["bakenray <lpqstrong@gmail.com>"]
license = "MIT OR Apache-2.0 OR Unicode-DFS-2016 OR MPL-2.0 OR BSD-2-Clause OR BSD-3-Clause OR ISC OR CC0-1.0"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# serde_yaml 官方仓库已停止维护（RUSTSEC-2024-0320），这里引入社区维护的分支
# serde_yaml_ng，并通过 package 重命名保证代码中仍使用 `serde_yaml::` 路径
serde_yaml = { version = "0.9.34", package = "serde_yaml_ng" }
toml = "1.1.8"
zxcvbn = "3.1.1"
